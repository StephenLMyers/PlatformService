name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Phase 2 scope: sanitizers (ASan/UBSan) and Valgrind now cover real listener/
# TLS/thread-pool code, and a ThreadSanitizer job is added beyond plan section
# 16's matrix -- phase 2 is the first code in the project with real
# concurrency (plan 3.3), which is exactly what TSan exists to catch, added
# deliberately rather than waiting for a race to actually appear. Memory
# budgets and serial rate-limit tests land as the code those jobs exercise
# is written.
#
# Phase 3 adds fuzz-smoke (plan 8.6): libFuzzer needs Clang, which every
# other job deliberately does not install (see plan 16.2) -- only this job
# does, scoped to itself.
jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential libssl-dev libsqlite3-dev pkg-config

      - name: Build with warnings as errors
        run: make

      - name: Banned function check
        run: make check-banned

      - name: Unit tests
        run: make test

      - name: Configuration validates
        env:
          # A throwaway value for CI only. Deliberately a workflow env var and
          # not a repository secret: storing it as a secret would imply it
          # guards something, and it does not.
          PS_JWT_SECRET: ci-only-not-a-real-secret-000000000000
        run: make check-config

      - name: Generate dev cert
        run: make dev-cert

      - name: Starts, serves /healthz over TLS, and shuts down cleanly on SIGTERM
        env:
          PS_JWT_SECRET: ci-only-not-a-real-secret-000000000000
        run: |
          ./build/platformservice > run.log 2>&1 &
          pid=$!
          sleep 1
          printf 'GET /healthz HTTP/1.1\r\nHost: x\r\nConnection: close\r\n\r\n' \
            | timeout 3 openssl s_client -connect 127.0.0.1:8443 -quiet -verify_quiet 2>/dev/null \
            | tee client.log
          grep -q "200 OK" client.log
          grep -q '"status":"ok"' client.log
          kill -TERM $pid
          wait $pid
          rc=$?
          cat run.log
          test $rc -eq 0
          grep -q "shutdown complete" run.log

  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential libssl-dev libsqlite3-dev pkg-config

      # -fno-sanitize-recover=undefined: UBSan otherwise prints and continues,
      # which would let real undefined behavior pass CI silently.
      - name: Build and run unit tests under ASan/UBSan
        run: |
          make SANFLAGS="-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer"
          make test SANFLAGS="-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer"

      - name: Generate dev cert
        run: make dev-cert

      - name: Starts, serves /healthz over TLS, and shuts down cleanly under ASan/UBSan
        env:
          PS_JWT_SECRET: ci-only-not-a-real-secret-000000000000
        run: |
          ./build/platformservice > run.log 2>&1 &
          pid=$!
          sleep 1
          printf 'GET /healthz HTTP/1.1\r\nHost: x\r\nConnection: close\r\n\r\n' \
            | timeout 3 openssl s_client -connect 127.0.0.1:8443 -quiet -verify_quiet 2>/dev/null \
            | tee client.log
          grep -q "200 OK" client.log
          grep -q '"status":"ok"' client.log
          kill -TERM $pid
          wait $pid
          rc=$?
          cat run.log
          test $rc -eq 0
          grep -q "shutdown complete" run.log

  tsan:
    name: ThreadSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential libssl-dev libsqlite3-dev pkg-config

      # Known-benign, out-of-our-control races reported here (see
      # tests/tsan.supp) are inside OpenSSL 3.x's own internal algorithm-fetch
      # cache and glibc's pthread_create stack-cache reuse -- neither has a
      # single frame in this project's code, and both are documented,
      # recognized false-positive classes for exactly this kind of sanitizer.
      - name: Build and run unit tests under ThreadSanitizer
        env:
          TSAN_OPTIONS: suppressions=tests/tsan.supp
        run: |
          make SANFLAGS="-fsanitize=thread"
          make test SANFLAGS="-fsanitize=thread"

  fuzz-smoke:
    name: Fuzz smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Clang only here (plan 8.6, 16.2) -- libFuzzer is an LLVM feature GCC
      # doesn't implement. No other job installs it, and local dev never
      # needs it either; `make fuzz`/`make fuzz-smoke` simply aren't part of
      # the GCC-only base toolchain.
      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang libssl-dev libsqlite3-dev pkg-config

      - name: Build and run fuzz targets (60s each, tracked corpus)
        run: make fuzz-smoke

  harness:
    name: Python harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential libssl-dev libsqlite3-dev pkg-config python3-venv

      # make harness builds the real binary itself and creates its own venv;
      # no PS_JWT_SECRET here -- conftest.py generates a fresh one per
      # launched instance (tests/harness/conftest.py:base_env).
      - name: Run black-box pytest suite (plan 8.1) and memory baselines (plan 8.5)
        run: make harness

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential libssl-dev libsqlite3-dev pkg-config python3-venv

      # --coverage via SANFLAGS -- the same mechanism the sanitizer jobs
      # use (see the Makefile comment next to SANFLAGS). The Python harness
      # below runs against these same instrumented objects, not a
      # separately built binary, so its counts accumulate into the same
      # .gcda files instead of starting over: main.c, api/routes.c, and
      # api/health_api.c are only ever exercised by the harness driving the
      # real binary, never by a unit test, so skipping this step would
      # undercount real coverage by leaving those files at 0%.
      - name: Build and run C unit tests (coverage-instrumented)
        run: |
          make SANFLAGS="--coverage"
          make test SANFLAGS="--coverage"

      - name: Run Python harness against the same instrumented binary
        run: make harness

      - name: Generate coverage report
        run: |
          python3 -m venv /tmp/covenv
          /tmp/covenv/bin/pip install --quiet gcovr==8.6
          /tmp/covenv/bin/gcovr --root . --filter 'src/' \
              --markdown --markdown-heading-level 2 -o coverage-summary.md build/
          /tmp/covenv/bin/gcovr --root . --filter 'src/' \
              --html-details --html-single-page -o coverage.html build/
          cat coverage-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage.html

  memcheck:
    name: Valgrind
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential libssl-dev libsqlite3-dev pkg-config valgrind

      - name: Build
        run: make

      # Gates on definite and indirect leaks only. "Still reachable" is
      # expected from OpenSSL's one-time init and is not a defect; failing on
      # it would train everyone to ignore this job.
      - name: Leak check (config path)
        env:
          PS_JWT_SECRET: ci-only-not-a-real-secret-000000000000
        run: |
          valgrind --leak-check=full \
                   --show-leak-kinds=definite,indirect \
                   --errors-for-leak-kinds=definite,indirect \
                   --error-exitcode=1 \
                   ./build/platformservice --check-config

      - name: Generate dev cert
        run: make dev-cert

      # Same check, but over the real listener/TLS/thread-pool/HTTP/shutdown
      # path now that phase 3 has one -- --check-config alone never touches it.
      - name: Leak check (listen, serve /healthz, shut down)
        env:
          PS_JWT_SECRET: ci-only-not-a-real-secret-000000000000
        run: |
          valgrind --leak-check=full \
                   --show-leak-kinds=definite,indirect \
                   --errors-for-leak-kinds=definite,indirect \
                   --error-exitcode=1 \
                   --log-file=valgrind-run.log \
                   ./build/platformservice &
          pid=$!
          sleep 2
          printf 'GET /healthz HTTP/1.1\r\nHost: x\r\nConnection: close\r\n\r\n' \
            | timeout 3 openssl s_client -connect 127.0.0.1:8443 -quiet -verify_quiet 2>/dev/null \
            | tee client.log
          grep -q "200 OK" client.log
          grep -q '"status":"ok"' client.log
          kill -TERM $pid
          wait $pid
          rc=$?
          cat valgrind-run.log
          test $rc -eq 0
